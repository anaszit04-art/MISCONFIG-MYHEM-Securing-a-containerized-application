services:
  api:
    build: ./app
    env_file: .env
    depends_on:
      - db
      - minio
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/uploads
      - ./static:/static
      - ./:/app-root  # M4: permet /leak/.env (volontaire)

  db:
    image: postgres:15
    env_file: .env
    ports:
      - "5432:5432"   # M12: DB exposée

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"   # M5: Adminer exposé

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "9000:9000"   # M12: MinIO exposé
      - "9001:9001"   # M6: Console exposée
    volumes:
      - minio_data:/data

  mc:
    image: minio/mc
    depends_on:
      - minio
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$MINIO_BUCKET || true;
      mc anonymous set download local/$$MINIO_BUCKET || true;
      echo 'H1 = demo' > /tmp/resultat_merkle.txt;
      mc cp /tmp/resultat_merkle.txt local/$$MINIO_BUCKET/resultat_merkle.txt || true;
      exit 0;
      "

volumes:
  minio_data: