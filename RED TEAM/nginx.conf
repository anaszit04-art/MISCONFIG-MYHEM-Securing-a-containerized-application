server {
  listen 80;

  # Reverse proxy vers FastAPI
  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static (optionnel)
  location /static/ {
    alias /static/;
  }

  # M3: directory listing sur uploads
  location /uploads/ {
    alias /uploads/;
    autoindex on;
  }

  # M4: leak fichiers sensibles via /leak/
  location /leak/ {
    alias /app-root/;
    autoindex on;
  }

  # M11: endpoint qui provoque une erreur 500 (page nginx)
  location /nginx-error/ {
    return 500;
  }
}