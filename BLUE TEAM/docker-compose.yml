services:
  api:
    image: python:3.10-slim
    container_name: sharepy_api
    working_dir: /app
    volumes:
      - ./app:/app
      - ./data/uploads:/uploads
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: sharepy_db
    environment:
      POSTGRES_USER: sharepy_user
      POSTGRES_PASSWORD: Strong_DB_Password_2025!
      POSTGRES_DB: sharepy
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: sharepy_minio
    command: server /data
    environment:
      MINIO_ROOT_USER: sharepy_minio
      MINIO_ROOT_PASSWORD: Strong_MinIO_Password_2025!
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: sharepy_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/uploads:/var/www/uploads:ro
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
