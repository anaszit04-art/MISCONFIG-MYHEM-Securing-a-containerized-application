events {
    worker_connections 1024;
}

http {

    # =========================
    # DURCISSEMENT GLOBAL
    # =========================

    server_tokens off;

    # Logs sobres (pas de fuite chemins)
    log_format minimal '$remote_addr [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log minimal;
    error_log /var/log/nginx/error.log warn;

    # Protections basiques
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 10;
    types_hash_max_size 2048;

    # =========================
    # SERVER
    # =========================

    server {
        listen 80 default_server;
        server_name _;

        # =========================
        # HEADERS DE SÉCURITÉ
        # =========================

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # (HSTS non activé car HTTP local — à activer en HTTPS)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # =========================
        # LIMITES ANTI-ABUS
        # =========================

        client_max_body_size 10M;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # =========================
        # PROXY FASTAPI
        # =========================

        location / {
            proxy_pass http://api:8000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Powered-By;
        }

        # =========================
        # UPLOADS (LISTING BLOQUÉ)
        # =========================

        location /uploads/ {
            alias /var/www/uploads/;
            autoindex off;
            default_type application/octet-stream;
        }

        # =========================
        # BLOQUER FICHIERS SENSIBLES
        # =========================

        location ~* (\.env|\.git|\.py|\.pyc|\.sqlite3?|\.db|\.bak|\.old|\.log)$ {
            deny all;
            return 403;
        }

        # Bloquer tous les fichiers cachés
        location ~ /\. {
            deny all;
            return 403;
        }

        # =========================
        # ERREURS GÉNÉRIQUES
        # =========================

        error_page 403 /403.html;
        error_page 404 /404.html;

        location = /403.html {
            internal;
        }

        location = /404.html {
            internal;
        }
    }
}
